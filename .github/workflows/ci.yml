name: CIRCUIT Verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - run: npm run verify
      - name: Package verified release source
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: circuit-release-source
          path: |
            package.json
            src
            public
            scripts
            docs
            test
            README.md
            SECURITY.md
            LICENSE
            Dockerfile
            .env.example
            .dockerignore
            .gitignore
          if-no-files-found: error
          retention-days: 1
